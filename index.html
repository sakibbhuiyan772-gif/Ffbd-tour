
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FFBD Tour</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #06152e;
  color: white;
  text-align: center;
}

header {
  padding: 30px 15px;
  background: linear-gradient(135deg,#06152e,#075985);
  border-bottom: 2px solid #38bdf8;
}

header h1 {
  color: #38bdf8;
  font-size: 32px;
}

section {
  background: #102b50;
  margin: 20px 12px;
  padding: 22px 15px;
  border-radius: 15px;
  border: 1px solid #38bdf8;
}

h2 {
  color: #38bdf8;
}

input {
  width: 100%;
  max-width: 350px;
  padding: 14px;
  margin: 8px 0;
  border-radius: 8px;
  border: 1px solid #38bdf8;
  background: #06152e;
  color: white;
}

button {
  background: #0284c7;
  color: white;
  padding: 14px 25px;
  border: none;
  border-radius: 8px;
  font-size: 16px;
}

footer {
  padding: 20px;
  color: #bae6fd;
}
</style>
</head>

<body>

<header>
  <h1>❄️ FFBD TOUR ❄️</h1>
  <p>Free Fire Tournament Platform</p>
</header>

<section>
  <h2>Registration</h2>

  <form>
    <input type="tel" placeholder="Phone Number" required>

    <input type="password"
    placeholder="Password"
    autocomplete="new-password" required>

    <input type="text" placeholder="Name" required>

    <button type="submit">Register Now</button>
  </form>
</section>

<section>
  <h2>🏆 Tournament List</h2>
  <p>Coming Soon...</p>
</section>

<section>
  <h2>📜 Tournament Rules</h2>
  <p>1. No cheating.</p>
  <p>2. Fair play only.</p>
  <p>3. Follow tournament rules.</p>
</section>

<section>
  <h2>📲 Download App</h2>
  <p>Coming Soon...</p>
</section>

<footer>
  <p>© 2026 FFBD Tour</p>
  <p>All Rights Reserved</p>
</footer>

</body>
</html>
